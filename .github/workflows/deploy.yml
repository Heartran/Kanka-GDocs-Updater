name: Deploy to Google Apps Script

on:
  push:
    branches: [ "External-script" ]   # cambia se rilasci da un altro branch
  workflow_dispatch:       # così puoi lanciarla anche a mano

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm i -g @google/clasp

      # Crea .clasp.json se NON lo committi nel repo
      - name: Create .clasp.json (optional)
        if: ${{ secrets.SCRIPT_ID != '' }}
        run: |
          echo '{"scriptId":"'"${{ secrets.SCRIPT_ID }}"'","rootDir":"."}' > .clasp.json

      # Auth: usa i token generati dal tuo login locale
      - name: Authenticate clasp
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push -f

      # (Opzionale) Version & deploy se usi Web App/Library
      - name: Create version and deploy (optional)
        run: |
          clasp version "CI $GITHUB_SHA" || true
          clasp deploy --description "CI $GITHUB_SHA" || true
