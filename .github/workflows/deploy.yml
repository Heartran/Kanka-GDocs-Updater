name: Deploy to Google Apps Script

on:
  push:
    branches: [ "main" ]   # cambia se rilasci da un altro branch
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm i -g @google/clasp

      # Se SCRIPT_ID è presente nei secrets, genera .clasp.json al volo.
      # Altrimenti si assume che .clasp.json sia già nel repo.
      - name: Create .clasp.json if secret is set
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -n "${SCRIPT_ID}" ]; then
            echo "{\"scriptId\":\"${SCRIPT_ID}\",\"rootDir\":\".\"}" > .clasp.json
            echo "Created .clasp.json from secret."
          else
            echo "No SCRIPT_ID secret found. Assuming .clasp.json is committed."
            [ -f .clasp.json ] && cat .clasp.json || echo "WARNING: .clasp.json not found."
          fi

      # Autenticazione: usiamo i token generati dal tuo login locale
      - name: Authenticate clasp
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json
          # piccolo sanity check
          test -s ~/.clasprc.json && echo "clasprc present" || (echo "Missing clasprc" && exit 1)

      - name: Push to Apps Script
        run: clasp push -f

      # (Opzionale) Version & deploy se usi Web App/Library
      - name: Create version and deploy (optional)
        run: |
          clasp version "CI $GITHUB_SHA" || true
          clasp deploy --description "CI $GITHUB_SHA" || true
